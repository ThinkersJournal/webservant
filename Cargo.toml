[package]
name = "webservant"
version = "0.4.2"
edition = "2024"
description = "A web server program and library: static files, a reverse proxy and automatic HTTPS certificates (ACME), on the Rust web library you choose (built on HTTPAnt)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/webservant"
readme = "README.md"
keywords = ["web-server", "https", "acme", "static-files", "reverse-proxy"]
categories = ["web-programming::http-server", "network-programming"]
# Only what a user needs; the tests, project notes, CI files and the hand-off are not shipped.
include = ["src/**", "examples/**", "docs/QUICKSTART.md", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpant = { version = "~0.5.22", features = ["tls", "https"] }
httpdate = "1.0.3"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "x509-parser", "time"] }
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "signal", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
x509-parser = "0.18"

[dev-dependencies]
configurant = "0.6.3"
httpant = { version = "~0.5.22", features = ["https", "tls"] }
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.2.1"

[features]
# Each web library is opt-in; hyper is always there. These switch on HTTPAnt's feature of the same name.
axum = ["httpant/axum"]
actix-web = ["httpant/actix-web"]
poem = ["httpant/poem"]
salvo = ["httpant/salvo"]
warp = ["httpant/warp"]
