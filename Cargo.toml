[package]
name = "webservant"
version = "0.1.0"
edition = "2024"
description = "Reserved name: a web server program that works with any Rust web library (built on HTTPAnt). Placeholder, no functionality yet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/webservant"
readme = "README.md"

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpant = { version = "~0.5.22", features = ["tls"] }
httpdate = "1.0.3"
mime_guess = "2.0.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
httpant = { version = "~0.5.22", features = ["https", "tls"] }
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[features]
# Each web library is opt-in; hyper is always there. These switch on HTTPAnt's feature of the same name.
axum = ["httpant/axum"]
actix-web = ["httpant/actix-web"]
poem = ["httpant/poem"]
salvo = ["httpant/salvo"]
warp = ["httpant/warp"]
